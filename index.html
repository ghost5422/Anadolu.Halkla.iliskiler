<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Öğrenci Portalı | Halkla İlişkiler</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* 1. Temel Ayarlar */
    :root {
      --primary-color: #8B0000; /* Bordo */
      --text-color: #2d3436;
      --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fad0c4, #a10000);
      --glass-bg: rgba(255, 255, 255, 0.90);
      --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: var(--glass-bg);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 40px 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
    }

    /* Profil İkonu */
    .profile-icon {
      width: 80px;
      height: 80px;
      background: var(--primary-color);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 15px auto;
      box-shadow: 0 4px 15px rgba(139, 0, 0, 0.3);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-color);
      margin: 0;
    }

    .header h2 {
      font-size: 14px;
      font-weight: 400;
      color: #636e72;
      margin: 5px 0 20px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Sosyal Medya */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .social-links a {
      text-decoration: none;
      color: #555;
      font-size: 24px;
      transition: all 0.3s ease;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: white;
    }

    .social-links a:hover { transform: translateY(-3px); }
    .social-links .fa-instagram:hover { color: #E1306C; }
    .social-links .fa-whatsapp:hover { color: #25D366; }
    .social-links .fa-youtube:hover { color: #FF0000; }

    /* Buton Tasarımı (Anchor Tag) */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: #ffffff;
      border: 1px solid #eee;
      border-radius: 16px;
      text-decoration: none; /* Link alt çizgisini kaldırır */
      color: #2d3436;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .link-btn i {
      font-size: 18px;
      width: 30px;
      text-align: center;
      margin-right: 15px;
      color: var(--primary-color);
      transition: color 0.3s ease;
    }

    .link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border-color: var(--primary-color);
    }

    .link-btn:hover i { transform: scale(1.1); }
    
    /* Ok İşareti */
    .link-btn::after {
      content: '\f054'; 
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 20px;
      font-size: 12px;
      color: #ccc;
      transition: right 0.3s ease;
    }

    .link-btn:hover::after {
      right: 15px;
      color: var(--primary-color);
    }

    .footer-note {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.05);
      font-size: 12px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="profile-icon">
      <i class="fas fa-graduation-cap"></i>
    </div>

    <div class="header">
      <h1>Halkla İlişkiler ve Reklamcılık</h1>
      <h2>Öğrenci Bilgi Portalı</h2>
    </div>

    <div class="social-links">
      <a href="https://www.instagram.com/aof_halklailiskilerreklamcilik/" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://chat.whatsapp.com/HxUm7sZkBkxAomZFu1tHU8" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://youtube.com/@aofcuabla?si=UbuzUzh9HpBcmuSy" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>

    <div class="link-list">
      
      <a href="https://ekampus.anadolu.edu.tr/#/login" target="_blank" class="link-btn">
        <i class="fas fa-university"></i>
        <span>E-Kampüs Girişi</span>
      </a>

      <a href="https://aosogrenci.anadolu.edu.tr/" target="_blank" class="link-btn">
        <i class="fas fa-id-card-alt"></i>
        <span>Öğrenci Bilgi Sistemi (OBS)</span>
      </a>

      <a href="bilgi.html" class="link-btn">
        <i class="fas fa-info-circle"></i>
        <span>Bölüm Hakkında Bilgi</span>
      </a>

      <a href="test.html" class="link-btn">
        <i class="fas fa-calculator"></i>
        <span>Vize & Final Not Hesapla</span>
      </a>

      <a href="kontrol.html" class="link-btn">
        <i class="fas fa-check-double"></i>
        <span>Çıkmış Sorular Kontrolü</span>
      </a>

    </div>

    <div class="footer-note">
      <p><i class="fas fa-lightbulb" style="color: #f1c40f;"></i> Not: Çıkmış sorularınızı sistem üzerinden test edebilir, anlık doğru-yanlış kontrolü yapabilirsiniz.</p>
    </div>

  </div>

</body>
</html>

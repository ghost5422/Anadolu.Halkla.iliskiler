<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Not Hesaplayıcı</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* 1. Temel Değişkenler (Bordo Tema) */
    :root {
      --primary: #8B0000; /* Bordo */
      --primary-hover: #a00000;
      --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fad0c4, #a10000);
      
      --card-bg: rgba(255, 255, 255, 0.90);
      --text-color: #2d3436;
      --input-bg: #ffffff;
      --border-color: #e0e0e0;
      
      /* Durum Renkleri */
      --success: #27ae60;
      --error: #c0392b;
      --warning: #f39c12;
    }

    /* Karanlık Mod Değişkenleri */
    body.dark {
      --card-bg: rgba(30, 30, 30, 0.95);
      --text-color: #ecf0f1;
      --input-bg: #2c3e50;
      --border-color: #444;
      --bg-gradient: linear-gradient(-45deg, #232526, #414345);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      color: var(--text-color);
      transition: background 0.4s, color 0.4s;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 2. Ana Kart */
    .container {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 35px 30px;
      width: 100%;
      max-width: 450px;
      transition: all 0.3s ease;
      position: relative;
    }

    /* Başlık */
    h2 {
      text-align: center;
      color: var(--primary);
      margin: 10px 0 25px 0;
      font-size: 24px;
      font-weight: 700;
    }

    body.dark h2 { color: #ff6b6b; }

    /* Geri Dön Butonu */
    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid var(--border-color);
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-color);
      margin-bottom: 20px;
      transition: all 0.3s;
      text-decoration: none;
      width: fit-content;
    }

    .back-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(139, 0, 0, 0.05);
    }

    /* Form Elemanları */
    label {
      font-weight: 600;
      margin: 12px 0 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    
    label i { color: var(--primary); }
    body.dark label i { color: #ff6b6b; }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: var(--input-bg);
      font-size: 16px;
      color: var(--text-color);
      transition: 0.3s;
      font-family: 'Inter', sans-serif;
    }

    input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 4px rgba(139, 0, 0, 0.1);
    }

    /* Butonlar */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button.action-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
    }

    .btn-calc { background: linear-gradient(135deg, var(--primary), #c0392b); }
    .btn-reset { background: #95a5a6; }
    
    button.action-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    button.action-btn:active { transform: scale(0.98); }

    /* Sonuç Alanı */
    .result {
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      display: none; /* JS ile açılacak */
    }

    .result.visible { display: block; animation: popIn 0.5s ease; }
    @keyframes popIn { from{transform: scale(0.9); opacity:0;} to{transform: scale(1); opacity:1;} }

    .pass { background: rgba(39, 174, 96, 0.1); color: var(--success); border: 1px solid var(--success); }
    .fail { background: rgba(192, 57, 43, 0.1); color: var(--error); border: 1px solid var(--error); }
    .yellow { background: rgba(243, 156, 18, 0.1); color: var(--warning); border: 1px solid var(--warning); }

    /* Tablo */
    .table-container {
      margin-top: 25px;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: rgba(139, 0, 0, 0.05);
      color: var(--primary);
      font-weight: 700;
    }
    
    body.dark th { background: rgba(255, 255, 255, 0.1); color: #ff6b6b; }

    tr:last-child td { border-bottom: none; }

    /* Alt Bilgi */
    .info {
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
      opacity: 0.7;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    /* Tema Değiştirici Buton */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.3s;
    }

    .theme-toggle:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

  </style>
</head>
<body>

  <div class="container">
    
    <div class="theme-toggle" onclick="toggleTheme()" title="Temayı Değiştir">
      <i class="fas fa-moon"></i>
    </div>

    <h2><i class="fas fa-calculator"></i> Not Hesaplayıcı</h2>

    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
    </a>

    <label for="ders"><i class="fas fa-book"></i> Ders Adı</label>
    <input type="text" id="ders" placeholder="Örn: İletişim Tarihi">

    <div style="display: flex; gap: 15px;">
      <div style="flex:1;">
        <label for="vize"><i class="fas fa-file-alt"></i> Vize</label>
        <input type="number" id="vize" placeholder="0-100">
      </div>
      <div style="flex:1;">
        <label for="final"><i class="fas fa-file-signature"></i> Final</label>
        <input type="number" id="final" placeholder="0-100">
      </div>
    </div>

    <div class="btn-group">
      <button class="action-btn btn-calc" onclick="hesapla()">
        <i class="fas fa-equals"></i> Hesapla
      </button>
      <button class="action-btn btn-reset" onclick="sifirla()">
        <i class="fas fa-trash"></i> Temizle
      </button>
    </div>

    <div class="result" id="result"></div>

    <div class="table-container">
      <table id="gecmis">
        <thead>
          <tr>
            <th>Ders</th>
            <th>Vize</th>
            <th>Final</th>
            <th>Ort.</th>
            <th>Durum</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

    <div class="info">
      <p><i class="fas fa-info-circle"></i> Geçme Notu: 35 | Vize %30 + Final %70</p>
    </div>
  </div>

  <script>
    const resultDiv = document.getElementById("result");
    const tableBody = document.querySelector("#gecmis tbody");
    const themeToggle = document.querySelector(".theme-toggle");
    const GECME_NOTU = 35;

    /* Sayfa Yüklendiğinde */
    document.addEventListener("DOMContentLoaded", () => {
      loadTable();
      // Kayıtlı tema var mı kontrol et
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
      }
    });

    /* === HESAPLAMA FONKSİYONU === */
    function hesapla() {
      const ders = document.getElementById("ders").value.trim();
      const vizeInput = document.getElementById("vize").value;
      const finalInput = document.getElementById("final").value;

      // 1. Validasyon
      if (ders === "") {
        Swal.fire({icon: 'warning', title: 'Eksik Bilgi', text: 'Lütfen ders adını giriniz!', confirmButtonColor: '#8B0000'});
        return;
      }
      if (vizeInput === "") {
        Swal.fire({icon: 'warning', title: 'Eksik Bilgi', text: 'Lütfen Vize notunu giriniz!', confirmButtonColor: '#8B0000'});
        return;
      }

      const vize = parseFloat(vizeInput);
      const now = new Date().toLocaleDateString("tr-TR");

      // 2. Senaryo: Sadece Vize Girildi (Final Tahmini)
      if (finalInput === "") {
        const gerekliFinal = (GECME_NOTU - (vize * 0.30)) / 0.70;
        let sonucMetni = "";
        let durumSinifi = "";
        let durumKisa = "";

        if (gerekliFinal > 100) {
          sonucMetni = "Vize çok düşük, finalden 100 alsan bile geçemezsin.";
          durumSinifi = "fail";
          durumKisa = "Kaldı";
        } else if (gerekliFinal <= 0) {
          sonucMetni = "Tebrikler! Finale girmeden geçtiniz (Barajı aştın).";
          durumSinifi = "pass";
          durumKisa = "Geçti";
        } else {
          sonucMetni = `Geçmek için finalden en az <b>${Math.ceil(gerekliFinal)}</b> almalısın.`;
          durumSinifi = "yellow";
          durumKisa = "Bekliyor";
        }

        gosterSonuc(sonucMetni, durumSinifi);
        saveToLocal({ tarih: now, ders, vize, final: "-", sonuc: "-", durum: durumKisa });
        loadTable();
        return;
      }

      // 3. Senaryo: Vize + Final Girildi (Ortalama Hesaplama)
      const final = parseFloat(finalInput);
      const ortalama = ((vize * 0.30) + (final * 0.70)).toFixed(2);
      const gectiMi = ortalama >= GECME_NOTU;
      
      const durumSinifi = gectiMi ? "pass" : "fail";
      const durumMetni = gectiMi ? "GEÇTİ" : "KALDI";
      const icon = gectiMi ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>';

      gosterSonuc(`${icon} Ortalama: <b>${ortalama}</b> - ${durumMetni}`, durumSinifi);
      
      saveToLocal({
        tarih: now,
        ders,
        vize,
        final,
        sonuc: ortalama,
        durum: durumMetni
      });

      loadTable();
    }

    /* === YARDIMCI FONKSİYONLAR === */
    function gosterSonuc(htmlText, className) {
      resultDiv.innerHTML = htmlText;
      resultDiv.className = "result visible " + className;
    }

    function saveToLocal(row) {
      const data = JSON.parse(localStorage.getItem("gecmisNotlar") || "[]");
      data.push(row);
      localStorage.setItem("gecmisNotlar", JSON.stringify(data));
    }

    function loadTable() {
      const data = JSON.parse(localStorage.getItem("gecmisNotlar") || "[]");
      tableBody.innerHTML = "";
      
      // Listeyi ters çevir (en son eklenen en üstte)
      data.slice().reverse().forEach(r => {
        const tr = document.createElement("tr");
        
        let renk = "";
        if(r.durum === "Geçti" || r.durum === "GEÇTİ") renk = "color: var(--success); font-weight:bold;";
        else if(r.durum === "Kaldı" || r.durum === "KALDI") renk = "color: var(--error); font-weight:bold;";
        
        tr.innerHTML = `
          <td style="text-align:left;">${r.ders}</td>
          <td>${r.vize}</td>
          <td>${r.final}</td>
          <td>${r.sonuc}</td>
          <td style="${renk}">${r.durum}</td>
        `;
        tableBody.appendChild(tr);
      });

      if(data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" style="color:#999;">Henüz kayıt yok.</td></tr>';
      }
    }

    function sifirla() {
      Swal.fire({
        title: "Tüm kayıtlar silinsin mi?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#8B0000",
        cancelButtonColor: "#95a5a6",
        confirmButtonText: "Evet, Sil",
        cancelButtonText: "Vazgeç"
      }).then(res => {
        if (res.isConfirmed) {
          localStorage.removeItem("gecmisNotlar");
          loadTable();
          resultDiv.className = "result"; // Sonucu gizle
          resultDiv.innerHTML = "";
          Swal.fire({title:"Silindi!", icon:"success", confirmButtonColor: "#8B0000"});
        }
      });
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      
      themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Not Hesaplayıcı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg-light: #f8f9fa;
      --card-light: #ffffff;
      --text-light: #1a1a1a;
      --primary: #5b4bff;
      --secondary: #4a00e0;
      --accent: #8a2be2;

      --bg-dark: #0d1117;
      --card-dark: #161b22;
      --text-dark: #e6edf3;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      transition: background 0.4s, color 0.4s;
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    .container {
      background: var(--card-light);
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
      padding: 25px;
      width: 380px;
      transition: all 0.4s ease;
    }

    body.dark .container {
      background: var(--card-dark);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }

    h2 {
      text-align: center;
      color: var(--secondary);
      margin-bottom: 20px;
      font-size: 26px;
      animation: fadeInDown 1s ease;
    }

    @keyframes fadeInDown {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    label {
      font-weight: bold;
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--primary);
      border-radius: 6px;
      background: rgba(90, 90, 255, 0.05);
      font-size: 15px;
      color: inherit;
      transition: 0.3s;
    }

    input:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 5px var(--accent);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .result {
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .pass { color: #00c853; }
    .fail { color: #ff1744; }
    .yellow { color: #ffc107; }

    .info {
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
      opacity: 0.8;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 14px;
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    th, td {
      border: 1px solid #aaa;
      padding: 8px;
      text-align: center;
    }

    th {
      background: var(--secondary);
      color: #fff;
    }

    body.dark th {
      background: var(--accent);
    }

    tr:nth-child(even) {
      background: rgba(90, 90, 255, 0.08);
    }

    body.dark tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.05);
    }

    .theme-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      cursor: pointer;
      background: var(--secondary);
      color: white;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.3s;
    }

    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.1);
    }

    @media (max-width: 480px) {
      .container { width: 90%; }
      h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>

  <div class="container">
    <h2><i class="fas fa-calculator"></i> Not Hesaplayıcı</h2>

<button onclick="window.location.href='index.html'" style="margin-bottom: 15px; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background-color: #eee; cursor: pointer; display: flex; align-items: center; gap: 5px;">
  <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
</button>

    <label><i class="fas fa-file-alt"></i> Vize Notu:</label>
    <input type="number" id="vize" placeholder="Vize puanınızı girin">

    <label><i class="fas fa-file-signature"></i> Final Notu:</label>
    <input type="number" id="final" placeholder="Final puanınızı girin">

    <button onclick="hesapla()"><i class="fas fa-equals"></i> Hesapla</button>
    <button onclick="sifirla()"><i class="fas fa-trash"></i> Sıfırla</button>

    <div class="result" id="result"></div>

    <table id="gecmis">
      <thead>
        <tr>
          <th>Tarih</th>
          <th>Vize</th>
          <th>Final</th>
          <th>Ortalama</th>
          <th>Durum</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="info">
      <p><i class="fas fa-info-circle"></i> Geçme Notu: 35</p>
      <p><i class="fas fa-percentage"></i> Vize %30, Final %70 etkili</p>
    </div>
  </div>

  <script>
    const resultDiv = document.getElementById("result");
    const tableBody = document.querySelector("#gecmis tbody");
    const gecmeNotu = 35;
    const themeToggle = document.querySelector(".theme-toggle");

    document.addEventListener("DOMContentLoaded", () => {
      loadTable();
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
      }
    });

    function hesapla() {
      const vize = parseFloat(document.getElementById('vize').value);
      const final = parseFloat(document.getElementById('final').value);
      if (isNaN(vize) || isNaN(final)) {
        Swal.fire("Eksik bilgi", "Lütfen hem vize hem final notunu girin!", "warning");
        return;
      }

      const ortalama = ((vize * 0.30) + (final * 0.70)).toFixed(2);
      const durum = ortalama >= gecmeNotu ? "Geçti" : "Kaldı";

      resultDiv.textContent = `Ortalama: ${ortalama} - ${durum}`;
      resultDiv.className = "result " + (durum === "Geçti" ? "pass" : "fail");

      const now = new Date().toLocaleString("tr-TR");
      const newRow = { tarih: now, vize, final, ortalama, durum };
      saveToLocal(newRow);
      loadTable();
    }

    function saveToLocal(row) {
      const data = JSON.parse(localStorage.getItem("gecmisNotlar") || "[]");
      data.push(row);
      localStorage.setItem("gecmisNotlar", JSON.stringify(data));
    }

    function loadTable() {
      const data = JSON.parse(localStorage.getItem("gecmisNotlar") || "[]");
      tableBody.innerHTML = "";
      data.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${r.tarih}</td><td>${r.vize}</td><td>${r.final}</td><td>${r.ortalama}</td><td>${r.durum}</td>`;
        tableBody.appendChild(tr);
      });
    }

    function sifirla() {
      Swal.fire({
        title: "Emin misiniz?",
        text: "Tüm kayıtlar silinecek!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#3085d6",
        cancelButtonColor: "#d33",
        confirmButtonText: "Evet, sil!",
        cancelButtonText: "Vazgeç"
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.removeItem("gecmisNotlar");
          tableBody.innerHTML = "";
          Swal.fire("Silindi!", "Tüm kayıtlar başarıyla silindi.", "success");
        }
      });
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }
  </script>
</body>
</html>
